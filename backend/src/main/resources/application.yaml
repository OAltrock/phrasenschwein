spring:
  application:
    name: phrasenSchwein
  datasource:
    url: jdbc:mariadb://localhost:3306/myapp
    username: appuser
    password: apppass
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-secret-key-change-me-please-32bytes-min}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
